[package]
name = "kelan-sahod"
version = "0.1.1"
description = "Kelan Sahod: countdown to your next payday"
edition = "2021"

[lib]
name = "kelan_sahod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ureq = "2"
